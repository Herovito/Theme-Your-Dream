<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave — Soft Blending</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f5f5f5; }

    .section {
      min-height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
    }

    .cream { background: #E0CDB8; color: #4A3329; }
    .walnut { background: #8C6B5A; color: #E0CDB8; }

    .wave-holder {
      height: 200px;
      position: relative;
      overflow: hidden;
      background: #8C6B5A;
    }

    svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

<section class="section cream">Cream Section</section>

<!-- WAVE: Wavy shape + soft blur + gradient -->
<div class="wave-holder">
  <svg viewBox="0 0 1440 200" preserveAspectRatio="none">
    <defs>
      <!-- Blur filter: soft edges -->
      <filter id="soft-blur">
        <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
      </filter>

      <!-- Gradient: cream → walnut -->
      <linearGradient id="blend" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#E0CDB8" />
        <stop offset="100%" style="stop-color:#8C6B5A" />
      </linearGradient>
    </defs>

    <!-- Wavy path met soft blur + gradient -->
    <path d="M0,120 Q360,60 720,120 T1440,120 L1440,0 L0,0 Z"
          fill="url(#blend)"
          filter="url(#soft-blur)" />
  </svg>
</div>

<section class="section walnut">Walnut Section</section>

</body>
</html>
